gold_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'gold-price-platform') }}"
      dataset: "{{ env_var('BQ_DATASET_NAME', 'gold_prices_db') }}"
      threads: 1
      keyfile: "{{ env_var('GCP_KEY_PATH', 'gcp-key.json') }}"

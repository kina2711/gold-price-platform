name: daily-update

on:
  schedule:
    # 07:00 ICT (UTC+7) — cập nhật giá vàng buổi sáng
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run Prefect Pipeline (Extract, Load, dbt, Notify)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          BQ_DATASET_NAME: ${{ secrets.BQ_DATASET_NAME }}
          DBT_TARGET: ci
        run: uv run python src/pipeline/flows.py

      - name: Commit & push if anything changed
        run: |
          git config user.name "kina2711"
          git config user.email "183811251+kina2711@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore(data): ELT pipeline run ${today} [skip ci]"
          git push

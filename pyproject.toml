[project]
name = "gold-price-platform"
version = "0.1.0"
description = "Vietnam gold price monitor — scrape, README dashboard, Discord alerts"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Gold Price Platform" }]
keywords = ["gold", "vietnam", "price", "monitoring", "scraper"]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "httpx>=0.28",
    "requests>=2.32",
    "tzdata; sys_platform == 'win32'",
    "google-cloud-storage>=2.16.0",
    "google-cloud-bigquery>=3.20.0",
    "dbt-bigquery>=1.8.0",
    "prefect>=3.0.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
